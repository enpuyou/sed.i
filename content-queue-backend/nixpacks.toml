# No [phases.setup] override — let Nixpacks' native Python/Poetry provider
# auto-detect this project (pyproject.toml + poetry.lock present) and pick
# nixPkgs/nixpkgsArchive itself. A custom nixPkgs here previously bypassed
# that provider, installing Poetry from the nixpkgs "poetry" package at
# Nixpacks' own pinned nixpkgs archive commit (baked into the Nixpacks
# binary, not this project) — which resolves to Poetry 1.3.1, predating
# lock-version 2.1 support entirely. Hence "pyproject.toml changed
# significantly since poetry.lock was last generated": a real version
# incompatibility, misreported as a content-hash mismatch.
#
# [phases.install] below is fully custom (verified via local `nixpacks
# build`, not guessed):
#   - A bare `pip` is NOT on PATH from nixPkgs=["python311"] alone in this
#     pinned nixpkgs snapshot (confirmed: exit 127, "pip: command not
#     found", reproduced locally both with and without a setup override).
#   - `python -m venv` DOES provide a working pip once activated, in the
#     SAME shell invocation — each `cmds` entry is its own RUN layer, so
#     activation from one entry does not carry into the next; the venv
#     create + activate + pip-install-poetry + poetry-install sequence
#     must be chained with && inside a single cmds entry, matching
#     Nixpacks' own provider's approach.
#   - Nixpacks' own default follow-up command, `poetry install --no-dev
#     --no-interaction --no-ansi`, fails outright once reached: `--no-dev`
#     was removed in Poetry 2.x (deprecated since 1.2, gone by 2.0) —
#     confirmed locally, "The option --no-dev does not exist". Using this
#     project's own long-standing `--only main` instead.
# /opt/venv/bin is on PATH for the start command via NIXPACKS_PATH (set
# automatically once a venv phase is detected) — but NOT for other cmds
# entries within this same phase; each is its own RUN layer with only the
# image's baked PATH. Confirmed on Railway: unactivated `poetry run pip
# uninstall` resolved pip from the Nix-provided system Python instead of
# the venv, which PEP 668 refuses to let touch ("externally-managed-
# environment... tries to modify the immutable /nix/store filesystem").
# Every cmds entry that needs poetry/pip re-activates the venv explicitly.

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install poetry==2.4.1 && poetry install --no-root --only main",
  # ultralytics (YOLO PDF-layout extraction) transitively requires
  # opencv-python (the GUI variant, pulls in libGL). Poetry has no clean
  # mechanism to exclude a transitive dependency, so both variants get
  # installed side by side, pointing at the same cv2 import path — whichever
  # installs last wins. This forces headless to win, once at build time
  # (not on every boot, which was the previous behavior via the Procfile).
  ". /opt/venv/bin/activate && poetry run pip uninstall -y opencv-python opencv-python-headless",
  ". /opt/venv/bin/activate && poetry run pip install --no-deps opencv-python-headless==4.11.0.86"
]
paths = ["/opt/venv/bin"]

[phases.build]
cmds = []

[start]
# Migrations and the concurrent index build (scripts/post_deploy.py) run in
# Railway's preDeployCommand (railway.json) — a separate step that runs once
# per deploy, before any instance starts serving traffic, and is NOT re-run
# per-replica if RAILWAY_REPLICAS is ever set above 1. Previously both ran
# inline in this start command, coupling migration time to every instance's
# boot and re-running "CREATE INDEX CONCURRENTLY IF NOT EXISTS" redundantly
# per replica.
#
# Explicitly activates the venv rather than relying on NIXPACKS_PATH alone —
# preDeployCommand runs `poetry run python scripts/post_deploy.py` (also
# unactivated) and failed to find venv-installed packages on Railway
# (ModuleNotFoundError for a package confirmed installed in the build venv),
# so the same explicit activation is applied here as a precaution.
cmd = ". /opt/venv/bin/activate && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[phases.setup]
# Poetry is installed via pip in the install phase below, pinned to match
# poetry.lock's declared generator version — NOT via the nixPkgs "poetry"
# package, which resolves to whatever version the nixpkgs channel currently
# has (unpinned) and broke a production deploy on 2026-09-26: an older
# Poetry from that channel couldn't parse this repo's lock-version 2.1 lock
# file ("pyproject.toml changed significantly since poetry.lock was last
# generated" — a version-mismatch symptom, not an actual pyproject/lock
# drift).
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "pip install poetry==2.4.1",
  "rm -rf .venv",
  "poetry install --no-root --only main",
  # ultralytics (YOLO PDF-layout extraction) transitively requires
  # opencv-python (the GUI variant, pulls in libGL). Poetry has no clean
  # mechanism to exclude a transitive dependency, so both variants get
  # installed side by side, pointing at the same cv2 import path — whichever
  # installs last wins. This forces headless to win, once at build time
  # (not on every boot, which was the previous behavior via the Procfile).
  "poetry run pip uninstall -y opencv-python opencv-python-headless",
  "poetry run pip install --no-deps opencv-python-headless==4.11.0.86"
]

[phases.build]
cmds = []

[start]
# Migrations and the concurrent index build (scripts/post_deploy.py) run in
# Railway's preDeployCommand (railway.json) — a separate step that runs once
# per deploy, before any instance starts serving traffic, and is NOT re-run
# per-replica if RAILWAY_REPLICAS is ever set above 1. Previously both ran
# inline in this start command, coupling migration time to every instance's
# boot and re-running "CREATE INDEX CONCURRENTLY IF NOT EXISTS" redundantly
# per replica.
cmd = "poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"

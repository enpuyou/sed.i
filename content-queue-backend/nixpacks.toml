# No [phases.setup] override — let Nixpacks' native Python/Poetry provider
# auto-detect this project (pyproject.toml + poetry.lock present) and set up
# its own venv + pip + Poetry install. A custom nixPkgs override here
# previously bypassed that provider entirely, installing Poetry from the
# nixpkgs "poetry" package at Nixpacks' own pinned nixpkgs archive commit
# (bc8f8d1be5..., baked into the Nixpacks binary, not this project) — an
# older Poetry that couldn't parse this repo's lock-version 2.1 lock file
# ("pyproject.toml changed significantly since poetry.lock was last
# generated" — a version-mismatch symptom, not an actual pyproject/lock
# drift). Fixed 2026-09-27: removed the override; poetry version is now
# pinned via .tool-versions (poetry 2.4.1, matching the lock file's
# declared generator), which Nixpacks' own provider reads directly —
# see https://github.com/railwayapp/nixpacks/blob/main/src/providers/python.rs

[phases.install]
# "..." preserves the auto-detected provider's own install commands
# (venv creation, `pip install poetry==$NIXPACKS_POETRY_VERSION`,
# `poetry install`) — omitting it would silently replace Poetry's install
# entirely with just the two lines below.
cmds = [
  "...",
  # ultralytics (YOLO PDF-layout extraction) transitively requires
  # opencv-python (the GUI variant, pulls in libGL). Poetry has no clean
  # mechanism to exclude a transitive dependency, so both variants get
  # installed side by side, pointing at the same cv2 import path — whichever
  # installs last wins. This forces headless to win, once at build time
  # (not on every boot, which was the previous behavior via the Procfile).
  "pip uninstall -y opencv-python opencv-python-headless",
  "pip install --no-deps opencv-python-headless==4.11.0.86"
]

[phases.build]
cmds = []

[start]
# Migrations and the concurrent index build (scripts/post_deploy.py) run in
# Railway's preDeployCommand (railway.json) — a separate step that runs once
# per deploy, before any instance starts serving traffic, and is NOT re-run
# per-replica if RAILWAY_REPLICAS is ever set above 1. Previously both ran
# inline in this start command, coupling migration time to every instance's
# boot and re-running "CREATE INDEX CONCURRENTLY IF NOT EXISTS" redundantly
# per replica.
cmd = "poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"

# NOT ACTUALLY USED BY RAILWAY. Kept for documentation/local `nixpacks
# build -c nixpacks.celery.toml` only. Railway has no supported way for
# two services sharing one Root Directory to use two different Nixpacks
# config files — a `NIXPACKS_CONFIG_FILE` env var (previously set on the
# celery service) does not exist as a real Nixpacks setting; the actual
# flag is a CLI-only `-c`/`--config` argument Railway never exposes.
# Confirmed 2026-09-28: the celery service builds/runs using nixpacks.toml
# like every other service on this Root Directory. The celery worker's
# actual start command is instead set directly as this service's Start
# Command in the Railway dashboard (Settings → Deploy). If [phases.install]
# below ever needs to diverge from nixpacks.toml's, that divergence must
# happen some other way (e.g. a shared script both toml files call) since
# this file's [phases.install]/[phases.build] are equally unused.
#
# See nixpacks.toml for the full explanation of why [phases.install] is
# fully custom (`pip` isn't on PATH from nixPkgs alone, and Nixpacks' own
# default `poetry install --no-dev ...` fails on Poetry 2.x) — identical
# reasoning applies here, it's just not reachable.

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install poetry==2.4.1 && poetry install --no-root --only main",
  # See nixpacks.toml for the full explanation — the YOLO PDF-extraction
  # subprocess (app/tasks/_yolo_worker.py) this worker spawns imports cv2,
  # so the worker's venv needs the same headless-wins fix as the web build.
  ". /opt/venv/bin/activate && poetry run pip uninstall -y opencv-python opencv-python-headless",
  ". /opt/venv/bin/activate && poetry run pip install --no-deps opencv-python-headless==4.11.0.86"
]
paths = ["/opt/venv/bin"]

[phases.build]
cmds = []

[start]
# Explicitly activates the venv — see nixpacks.toml's [start] for why
# (NIXPACKS_PATH alone wasn't reliable for an unactivated `poetry run`).
cmd = ". /opt/venv/bin/activate && poetry run celery -A app.core.celery_app worker --loglevel=info --concurrency=2 --pool=solo --beat"

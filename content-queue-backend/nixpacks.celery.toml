[phases.setup]
nixPkgs = ["python311", "poetry"]

[phases.install]
cmds = [
  "rm -rf .venv",
  "poetry install --no-root --only main",
  # See nixpacks.toml for the full explanation — the YOLO PDF-extraction
  # subprocess (app/tasks/_yolo_worker.py) this worker spawns imports cv2,
  # so the worker's venv needs the same headless-wins fix as the web build.
  "poetry run pip uninstall -y opencv-python opencv-python-headless",
  "poetry run pip install --no-deps opencv-python-headless==4.11.0.86"
]

[start]
cmd = "poetry run celery -A app.core.celery_app worker --loglevel=info --concurrency=2 --pool=solo --beat"

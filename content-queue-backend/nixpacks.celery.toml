# No [phases.setup] override — see nixpacks.toml for the full explanation.
# Let Nixpacks' native Python/Poetry provider auto-detect and set up its own
# venv + pip + Poetry install; poetry version pinned via .tool-versions.

[phases.install]
# "..." preserves the auto-detected provider's own install commands — see
# nixpacks.toml for the full explanation.
cmds = [
  "...",
  # See nixpacks.toml for the full explanation — the YOLO PDF-extraction
  # subprocess (app/tasks/_yolo_worker.py) this worker spawns imports cv2,
  # so the worker's venv needs the same headless-wins fix as the web build.
  "pip uninstall -y opencv-python opencv-python-headless",
  "pip install --no-deps opencv-python-headless==4.11.0.86"
]

[start]
cmd = "poetry run celery -A app.core.celery_app worker --loglevel=info --concurrency=2 --pool=solo --beat"
